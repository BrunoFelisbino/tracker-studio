name: tracker_studio
description: Tracker Studio technical bench and laboratory app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.6.2
  dio: ^5.7.0
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  flutter_secure_storage: ^9.2.2
  geolocator: ^11.0.1
  flutter_libserialport: ^0.6.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  url_launcher: ^6.3.2
  file_selector: ^1.0.3
  sqflite_common_ffi: ^2.3.6
  path_provider: ^2.1.5
  path: ^1.9.1
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  http: ^1.3.0
  web_socket_channel: ^2.4.0
  fl_chart: ^1.2.0
  pdf: ^3.13.0
  printing: ^5.15.0
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0
  drift_dev: ^2.13.0


flutter:
